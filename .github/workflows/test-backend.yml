name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_Apex
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create CI env file
        run: |
          cat <<'EOF' > .env
          PROJECT_NAME=Apex Trading Platform
          ENVIRONMENT=local
          DOMAIN=localhost
          FRONTEND_HOST=http://localhost:5173
          BACKEND_CORS_ORIGINS=http://localhost:5173
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=just-for-ci
          POSTGRES_DB=apex_ci
          SECRET_KEY=just-for-ci-secret-key
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=just-for-ci-password
          EMAILS_FROM_EMAIL=noreply@example.com
          EMAILS_FROM_NAME=Apex Support
          SMTP_HOST=mailcatcher
          SMTP_PORT=1025
          SMTP_TLS=false
          DOCKER_USERNAME=local
          EOF
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.4.15"
          enable-cache: true
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: Project_Apex/backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: Project_Apex/backend
      - run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: Project_Apex/backend/htmlcov
          include-hidden-files: true
