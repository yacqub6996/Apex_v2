name: Deploy to Hostinger VPS

on:
  # 1. Allow manual trigger via button
  workflow_dispatch:
  # 2. Trigger on ANY push to main (No path filters blocking us).
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          # CORRECTED PATH: Points to the backend inside Project_Apex
          context: ./Project_Apex/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/apex-backend:latest

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMMISSION_BTC_ADDR: ${{ secrets.COPY_TRADING_COMMISSION_BTC_ADDRESS }}
        with:
          host: ${{ secrets.HOST_IP }}
          username: root
          password: ${{ secrets.HOST_PASSWORD }}
          envs: COMMISSION_BTC_ADDR
          script: |
            set -e
            # 1. Go to the manual folder we created on the VPS
            cd /home/apex-deployment

            # 2. Update COPY_TRADING_COMMISSION_BTC_ADDRESS and GLOBAL_BTC_DEPOSIT_ADDRESS in .env
            COMMISSION_BTC_ADDR="$(echo "$COMMISSION_BTC_ADDR" | tr -d '[:space:]')"
            if [ -n "$COMMISSION_BTC_ADDR" ]; then
              if grep -q "^COPY_TRADING_COMMISSION_BTC_ADDRESS=" .env 2>/dev/null; then
                sed -i "s|^COPY_TRADING_COMMISSION_BTC_ADDRESS=.*|COPY_TRADING_COMMISSION_BTC_ADDRESS=${COMMISSION_BTC_ADDR}|" .env
              else
                [ -n "$(tail -c1 .env 2>/dev/null)" ] && echo "" >> .env
                echo "COPY_TRADING_COMMISSION_BTC_ADDRESS=${COMMISSION_BTC_ADDR}" >> .env
              fi
              if grep -q "^GLOBAL_BTC_DEPOSIT_ADDRESS=" .env 2>/dev/null; then
                sed -i "s|^GLOBAL_BTC_DEPOSIT_ADDRESS=.*|GLOBAL_BTC_DEPOSIT_ADDRESS=${COMMISSION_BTC_ADDR}|" .env
              else
                echo "GLOBAL_BTC_DEPOSIT_ADDRESS=${COMMISSION_BTC_ADDR}" >> .env
              fi
              chmod 600 .env
            fi

            # 3. Pull the image we just built
            docker compose pull backend

            # 4. Run migrations and db initialization safely before restarting service
            docker compose run --rm backend bash scripts/prestart.sh

            # 5. Restart the backend
            docker compose up -d --force-recreate backend

            # 6. Verify global and commission BTC configuration is loaded in the backend
            docker compose exec -e EXPECTED_ADDR="$COMMISSION_BTC_ADDR" -T backend python -c "import os; from app.core.config import settings; assert (settings.GLOBAL_BTC_DEPOSIT_ADDRESS == os.environ.get('EXPECTED_ADDR') and settings.COPY_TRADING_COMMISSION_BTC_ADDRESS == os.environ.get('EXPECTED_ADDR')), 'Address mismatch'; print('Global and Commission BTC addresses verified successfully')"

            # 7. Clean up space
            docker image prune -f

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./Project_Apex/frontend
        run: npm ci

      # --- CRITICAL FIX 1: Inject the Production API URL before build ---
      - name: Configure and Build Frontend
        working-directory: ./Project_Apex
        run: |
          # Vite's envDir is Project_Apex, so write the production env file here.
          echo "VITE_API_URL=https://apex-portfolios.org" > .env.production

          npm --prefix frontend run build

      # --- Upload built frontend to the correct docroot on the VPS ---
      - name: Clear existing frontend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: root
          password: ${{ secrets.HOST_PASSWORD }}
          script: |
            DEPLOY_DIR="/home/apex-portfolios.org/public_html"
            mkdir -p ${DEPLOY_DIR}
            # Remove only files we manage, keep .htaccess and ACME dirs
            rm -rf ${DEPLOY_DIR}/index.html \
                   ${DEPLOY_DIR}/assets \
                   ${DEPLOY_DIR}/images \
                   ${DEPLOY_DIR}/apex-favicon.svg \
                   ${DEPLOY_DIR}/vite.svg

      - name: Upload frontend build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_IP }}
          username: root
          password: ${{ secrets.HOST_PASSWORD }}
          source: "Project_Apex/frontend/dist/*"
          target: "/home/apex-portfolios.org/public_html"
          strip_components: 3

      - name: Remove confirmed stale nested frontend deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: root
          password: ${{ secrets.HOST_PASSWORD }}
          script: |
            DEPLOY_DIR="/home/apex-portfolios.org/public_html"
            STALE_DIR="${DEPLOY_DIR}/Project_Apex"
            # The old SCP layout nests the built app at Project_Apex/frontend/dist.
            # Only remove that exact confirmed stale deployment tree.
            if [ -f "${STALE_DIR}/frontend/dist/index.html" ] && \
               [ -d "${STALE_DIR}/frontend/dist/assets" ]; then
              rm -rf -- "${STALE_DIR}"
            else
              echo "No confirmed stale nested frontend deployment found; leaving ${STALE_DIR} untouched."
            fi

      - name: Fix permissions and ensure .htaccess on CyberPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: root
          password: ${{ secrets.HOST_PASSWORD }}
          script: |
            DEPLOY_DIR="/home/apex-portfolios.org/public_html"
            SYSTEM_USER="apexp9890"
            # Ensure ownership
            chown -R $SYSTEM_USER:$SYSTEM_USER $DEPLOY_DIR
            # Ensure directory execute bits so LiteSpeed can traverse
            chmod 711 /home/apex-portfolios.org
            chmod 755 "$DEPLOY_DIR"
            # Assets/images may not exist on first deploy; ignore errors
            chmod 755 "$DEPLOY_DIR/assets" "$DEPLOY_DIR/images" 2>/dev/null || true
            # Standard file perms
            find "$DEPLOY_DIR" -type f -exec chmod 644 {} \;
